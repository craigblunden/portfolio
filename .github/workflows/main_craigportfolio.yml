# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - craigportfolio

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/main_craigportfolio.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore API project
        run: dotnet restore api/api/api.csproj

      - name: Build API project
        run: dotnet build api/api/api.csproj --configuration Release --no-restore

      - name: Publish API project
        run: dotnet publish api/api/api.csproj --configuration Release --no-build --output ./published-api

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-api
          path: ./published-api

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-api
          path: ./published-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_91161C60B28D41F7BCDF82D686CFC918 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B351F5B471394C388BBF0DB891D9754F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A96CD8C9D6824B33AE55337D047542DC }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "craigportfolio"
          slot-name: "Production"
          package: ./published-api
