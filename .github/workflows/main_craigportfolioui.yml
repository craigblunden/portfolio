name: Build and deploy Node.js app to Azure Web App - craigportfolioui

on:
  push:
    branches:
      - main
    paths:
      - "todo/**"
      - ".github/workflows/main_craigportfolioui.yml"
  workflow_dispatch:

concurrency:
  group: deploy-craigportfolioui
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: todo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: todo
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        working-directory: todo
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Create deployment package
        run: |
          cd todo
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          cat > .next/standalone/package.json <<'EOF'
          {
            "name": "craigportfolioui-runtime",
            "private": true,
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF
          cd .next/standalone
          zip -r ../../../todo-package.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_430A72AAC5104BC2BA6A908703B42EBA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3FBE68C0797B4752B6EAD4F2BD380895 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1F855EE745D74C5A87DB16B130A93073 }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "craigportfolioui"
          package: ./todo-package.zip
          startup-command: "node server.js"
